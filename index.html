<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deliveries</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#101310;--panel:#171b16;--panel-2:#1d2219;--line:#2a3126;--green:#4c8a55;--green-bright:#6bb873;--amber:#d9a441;--red:#c1594a;--blue:#7aa7c7;--text:#e9e7de;--dim:#9aa294;--faint:#5f6a5a;--r:10px}
:root[data-theme="light"]{--bg:#eef1ec;--panel:#fff;--panel-2:#f3f6f1;--line:#d4dccf;--green:#3d7a47;--green-bright:#2f6b3a;--text:#1d241b;--dim:#5a6556;--faint:#8a9486}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font:700 18px 'Space Grotesk',sans-serif;letter-spacing:.02em}
header h1 span{color:var(--green-bright)}
.mono{font-family:'JetBrains Mono',monospace}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.tb{flex:none;background:transparent;border:1px solid transparent;color:var(--dim);padding:7px 14px;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer}
.tb .i{color:var(--faint);font:11px 'JetBrains Mono',monospace;margin-right:5px}
.tb:hover{color:var(--text)}
.tb.on{background:var(--panel-2);border-color:var(--green);color:var(--green-bright)}
main{max-width:1000px;margin:0 auto;padding:14px}
.pane{display:none}.pane.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pt{font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.pt .i{color:var(--green-bright);font-family:'JetBrains Mono',monospace;margin-right:6px}
.pill{font:11px 'JetBrains Mono',monospace;color:var(--dim);background:var(--panel-2);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:9px 10px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)}
label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
button.b{background:var(--green);border:1px solid var(--green);color:#0d120c;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer}
button.b:hover{background:var(--green-bright)}
button.g{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 11px;border-radius:8px;cursor:pointer}
button.g:hover{border-color:var(--green);color:var(--green-bright)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font:600 22px 'Space Grotesk',sans-serif;color:var(--green-bright)}
.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--dim);font-size:12px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#0d120c}
.d{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line)}
.d:first-child{border-top:0}
.d .t{font-weight:600}.d .s{font-size:12px;color:var(--dim)}
.d .r{text-align:right}
.d .m{font:12px 'JetBrains Mono',monospace;color:var(--dim)}
.act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.badge{display:inline-block;font:500 11px 'JetBrains Mono',monospace;padding:2px 8px;border-radius:20px;border:1px solid currentColor}
.s0{color:var(--dim)}.s1{color:var(--amber)}.s2{color:var(--green-bright)}.s3{color:var(--blue)}.s4{color:var(--green)}
.empty{color:var(--faint);padding:12px 0;font-size:13px}
mark{background:#d9a44155;color:inherit;border-radius:2px}
@media print{header,nav,.act,.noprint{display:none!important}:root{--bg:#fff;--panel:#fff;--panel-2:#fff;--line:#bbb;--text:#000;--dim:#333;--green-bright:#000;--faint:#555}.panel,.stat{border-color:#999}}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th,.rt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rt th{color:var(--dim);font:500 11px 'JetBrains Mono',monospace;text-transform:uppercase;white-space:nowrap}
.rt .n{text-align:right;font-family:'JetBrains Mono',monospace}
.rt tfoot td{font-weight:600;border-top:2px solid var(--line)}
.tw{overflow-x:auto}
.rt input.ci,.rt select.ci{min-width:90px;padding:5px 6px;font-size:12px}
.rt td input.ci[type=number]{min-width:70px}
.warn{color:var(--amber);font-size:12px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;break-inside:avoid}
.pc img{width:100%;height:170px;object-fit:cover;display:block;cursor:zoom-in;background:var(--panel-2)}
.pc .pi{padding:8px 10px;font-size:12px}
.pc .pi b{display:block;font-size:13px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:10px}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
.sheet{background:#fff;color:#111;padding:22px;border-radius:8px;font-size:13px;margin-bottom:14px}
.sheet h1{margin:0;font:700 20px 'Space Grotesk',sans-serif}
.sheet .tt{font:700 18px 'Space Grotesk',sans-serif;letter-spacing:.08em;margin:10px 0 4px;padding:4px 0;border-top:3px solid #111;border-bottom:1px solid #111}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:8px 0}
.sf{border-bottom:1px solid #222;padding-bottom:2px;min-height:34px}
.sf span{display:block;font-size:10px;text-transform:uppercase;color:#555;letter-spacing:.05em}
.sf b{font-weight:600}
.sh2{margin:14px 0 6px;font:700 12px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #111}
.ck2{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px}
.sig{display:grid;grid-template-columns:2fr 1fr;gap:6px 18px;margin-top:10px}
.sig .sf{min-height:46px}
@media print{.sheet{padding:0;margin:0}.pb{page-break-after:always}}
</style></head><body>
<header><h1>Delivery <span>Manager</span></h1><button class="g" id="th">Theme</button></header>
<nav id="nav"></nav>
<main>

<div class="pane" id="p-over">
 <div class="stats" id="stats"></div>
 <div class="panel" id="due" style="display:none"></div>
 <div class="panel"><div class="ph"><div class="pt"><span class="i">01</span>Active Loads</div></div><div id="active"></div></div>
 <div class="panel"><div class="ph"><div class="pt"><span class="i">02</span>Recent Deliveries</div></div><div id="recent"></div></div>
</div>

<div class="pane" id="p-del">
 <div class="panel">
  <div class="ph"><div class="pt"><span class="i">03</span><span id="ft">New Delivery</span></div></div>
  <div class="fg">
   <div><label>Date</label><input type="date" id="f-date"></div>
   <div><label>Customer</label><input id="f-cust" list="custList" placeholder="Customer name"><datalist id="custList"></datalist></div>
   <div><label>Pickup</label><input id="f-from" placeholder="City, ST"></div>
   <div><label>Drop-off</label><input id="f-to" placeholder="City, ST"></div>
   <div><label>Load / Description</label><input id="f-load" placeholder="e.g. Zero-turn mower"></div>
   <div><label>Miles</label><input type="number" id="f-mi" inputmode="decimal" min="0"></div>
   <div><label>Rate ($)</label><input type="number" id="f-rate" inputmode="decimal" min="0"></div>
   <div><label>Status</label><select id="f-st"></select></div>
   <div><label>Unit #</label><input id="f-unit"></div>
   <div><label>Truck</label><select id="f-truck"></select></div>
   <div><label>Trailer</label><select id="f-trailer"></select></div>
   <div><label>Load make &amp; model</label><input id="f-lm" list="lmList" placeholder="Type to search your library"><datalist id="lmList"></datalist><div id="lmhint" style="color:var(--dim);font-size:11px;margin-top:3px"></div></div>
   <div><label>Load weight (lb)</label><input type="number" id="f-lw" inputmode="decimal" min="0"></div>
   <div><label>Load size (L×W×H)</label><input id="f-ld"></div>
  </div>
  <div style="margin-bottom:10px"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>
  <div id="plan" style="margin-bottom:10px"></div>
  <button class="g" type="button" data-td="2" style="margin-bottom:10px">Look up load on TractorData ↗</button><br>
  <button class="b" id="f-save">Save Delivery</button> <button class="g" id="f-cancel" style="display:none">Cancel edit</button>
 </div>
 <div class="panel">
  <div class="ph"><div class="pt"><span class="i">04</span>Deliveries</div><div class="pill" id="dcount"></div></div>
  <input id="q" type="search" placeholder="Search customer, city, load, unit, notes…">
  <div class="chips" id="chips"></div>
  <div id="dlist"></div>
 </div>
</div>

<div class="pane" id="p-eq"></div>

<div class="pane" id="p-calc"></div>

<div class="pane" id="p-hh"></div>

<div class="pane" id="p-log"></div>

<div class="pane" id="p-photo"></div>

<div class="pane" id="p-cust">
 <div class="panel">
  <div class="ph"><div class="pt"><span class="i">05</span>Add Customer</div></div>
  <div class="fg">
   <div><label>Name</label><input id="c-name"></div>
   <div><label>Phone</label><input id="c-phone" type="tel"></div>
   <div><label>Email</label><input id="c-email" type="email"></div>
   <div><label>Notes</label><input id="c-notes"></div>
  </div>
  <button class="b" id="c-save">Add Customer</button>
 </div>
 <div class="panel"><div class="ph"><div class="pt"><span class="i">06</span>Customers</div></div><div id="clist"></div></div>
</div>

<div class="pane" id="p-rep"></div>

<div class="pane" id="p-sheet"></div>

<div class="pane" id="p-adm"></div>

<div class="pane" id="p-data">
 <div class="panel">
  <div class="ph"><div class="pt"><span class="i">07</span>Data</div></div>
  <p class="s" style="color:var(--dim)">Data is saved in this browser. Export a backup file regularly, or move it to another device with Import.</p>
  <button class="b" id="x-json">Export backup (.json)</button> <button class="g" id="x-csv">Export deliveries (.csv)</button>
  <button class="g" id="x-imp">Import backup</button> <input type="file" id="x-file" accept=".json" style="display:none">
  <button class="g" id="x-print">Print</button>
 </div>
</div>
</main>

<script>
/* ===== STORAGE LAYER — swap these two functions for Firebase later; the rest of the app won't change ===== */
const KEY='bgt-deliveries-v1';
const DB={
 load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}},
 save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
};
/* ===== STATE ===== */
const STATUS=['Scheduled','In Transit','Delivered','Invoiced','Paid'];
let S=DB.load()||{deliveries:[],customers:[]};
const LOGK=['compliance','expenses','scales','detention','maint','brokers','dvir','incidents','dqf','links'];
['deliveries','customers','trucks','trailers','tractors',...LOGK].forEach(k=>S[k]=S[k]||[]);
S.settings=Object.assign({co:'Your Company Name',addr:'',contact:'',foot:'',title:'Delivery Report',pin:''},S.settings||{});
let filter='All',editId=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const commit=()=>{DB.save(S);render()};
const hl=(t,w)=>{t=esc(t);return w.length?t.replace(new RegExp('('+w.map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig'),'<mark>$1</mark>'):t};

/* ===== TABS ===== */
const TABS=[['over','Overview'],['del','Deliveries'],['eq','Equipment'],['calc','Load Calc'],['hh','Heavy Haul'],['log','Logs'],['photo','Photos'],['cust','Customers'],['rep','Reports'],['sheet','Sheets'],['adm','Admin'],['data','Data']];
$('nav').innerHTML=TABS.map((t,i)=>`<button class="tb" data-t="${t[0]}"><span class="i">0${i+1}</span>${t[1]}</button>`).join('');
function tab(t){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id=='p-'+t));document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
$('nav').onclick=e=>{const b=e.target.closest('.tb');if(b)tab(b.dataset.t)};

/* ===== RENDER ===== */
function row(d,w,full){
 const pm=d.miles&&d.rate?' · '+money(d.rate/d.miles)+'/mi':'';
 return `<div class="d"><div><div class="t">${hl(d.customer||'(no customer)',w)} <span class="badge s${d.status}">${STATUS[d.status]}</span></div>
 <div class="s">${hl(d.from||'?',w)} → ${hl(d.to||'?',w)}${d.load?' · '+hl(d.load,w):''}</div>
 ${full&&d.notes?`<div class="s">${hl(d.notes,w)}</div>`:''}</div>
 <div class="r"><div class="t mono">${money(d.rate)}</div><div class="m">${esc(d.date)}${d.miles?' · '+d.miles+' mi':''}${pm}${d.unit?' · #'+hl(d.unit,w):''}${d.lw?' · load '+Number(d.lw).toLocaleString()+' lb':''}</div></div>
 ${full?`<div class="act" style="grid-column:1/-1"><button class="g" data-adv="${d.id}">${d.status<4?'Mark '+STATUS[d.status+1]:'Done'}</button><button class="g" data-sh="${d.id}:p">Pickup sheet</button><button class="g" data-sh="${d.id}:d">Delivery sheet</button><button class="g" data-ed="${d.id}">Edit</button><button class="g" data-rm="${d.id}">Delete</button></div>`:''}</div>`}
function render(){
 const D=S.deliveries,ym=today().slice(0,7),mon=D.filter(d=>(d.date||'').startsWith(ym));
 const sum=(a,f)=>a.reduce((t,d)=>t+(Number(d[f])||0),0);
 const mi=sum(mon,'miles'),rev=sum(mon,'rate'),ex=S.expenses.filter(e=>(e.date||'').startsWith(ym)).reduce((t,e)=>t+(Number(e.amount)||0),0);
 $('stats').innerHTML=[['Active loads',D.filter(d=>d.status<2).length],['Awaiting invoice',D.filter(d=>d.status==2).length],['Unpaid invoices',money(sum(D.filter(d=>d.status==3),'rate'))],['Revenue (month)',money(rev)],['Miles (month)',mi.toLocaleString()],['Avg $/mile',mi?money(rev/mi):'—'],['Expenses (month)',money(ex)],['Net (month)',money(rev-ex)]].map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('');
 const act=D.filter(d=>d.status<2).sort((a,b)=>a.date<b.date?-1:1);
 $('active').innerHTML=act.map(d=>row(d,[],false)).join('')||'<div class="empty">No active loads.</div>';
 $('recent').innerHTML=D.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,5).map(d=>row(d,[],false)).join('')||'<div class="empty">No deliveries yet — add one on the Deliveries tab.</div>';
 fill();$('f-st').innerHTML=STATUS.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
 const names=[...new Set([...S.customers.map(c=>c.name),...D.map(d=>d.customer).filter(Boolean)])].sort();
 $('custList').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
 $('chips').innerHTML=['All',...STATUS].map(s=>`<button class="chip${filter==s?' on':''}" data-f="${s}">${s}</button>`).join('');
 const w=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 const list=D.filter(d=>(filter=='All'||STATUS[d.status]==filter)&&w.every(x=>[d.customer,d.from,d.to,d.load,d.lm,d.unit,d.notes,d.date].join(' ').toLowerCase().includes(x))).sort((a,b)=>a.date<b.date?1:-1);
 $('dlist').innerHTML=list.map(d=>row(d,w,true)).join('')||'<div class="empty">No deliveries match.</div>';
 $('dcount').textContent=list.length+' of '+D.length;
 $('clist').innerHTML=names.map(n=>{const c=S.customers.find(x=>x.name==n)||{},ds=D.filter(d=>d.customer==n);
  return `<div class="d"><div><div class="t">${esc(n)}</div><div class="s">${[c.phone,c.email,c.notes].filter(Boolean).map(esc).join(' · ')}</div></div><div class="r"><div class="t mono">${money(sum(ds,'rate'))}</div><div class="m">${ds.length} deliver${ds.length==1?'y':'ies'}</div>${c.name?`<div class="act"><button class="g" data-rc="${esc(n)}">Remove</button></div>`:''}</div></div>`}).join('')||'<div class="empty">No customers yet.</div>';
}

/* ===== ACTIONS ===== */
function resetForm(){editId=null;['f-cust','f-from','f-to','f-load','f-mi','f-rate','f-unit','f-notes','f-lm','f-lw','f-ld','f-truck','f-trailer'].forEach(i=>$(i).value='');$('f-date').value=today();$('f-st').value=0;$('ft').textContent='New Delivery';$('lmhint').textContent='';updatePlan();$('f-cancel').style.display='none'}
$('f-save').onclick=()=>{
 const o={date:$('f-date').value||today(),customer:$('f-cust').value.trim(),from:$('f-from').value.trim(),to:$('f-to').value.trim(),load:$('f-load').value.trim(),miles:Number($('f-mi').value)||0,rate:Number($('f-rate').value)||0,status:Number($('f-st').value),unit:$('f-unit').value.trim(),notes:$('f-notes').value.trim(),truck:$('f-truck').value,trailer:$('f-trailer').value,lm:$('f-lm').value.trim(),lw:Number($('f-lw').value)||0,ld:$('f-ld').value.trim()};
 if(!o.customer&&!o.from&&!o.to){alert('Enter at least a customer or a pickup/drop-off.');return}
 if(editId)Object.assign(S.deliveries.find(d=>d.id==editId),o);else S.deliveries.push({id:Date.now(),...o});
 resetForm();commit()};
$('f-cancel').onclick=resetForm;
$('c-save').onclick=()=>{const n=$('c-name').value.trim();if(!n)return;S.customers.push({name:n,phone:$('c-phone').value.trim(),email:$('c-email').value.trim(),notes:$('c-notes').value.trim()});['c-name','c-phone','c-email','c-notes'].forEach(i=>$(i).value='');commit()};
document.addEventListener('click',e=>{const t=e.target.dataset;
 if(t.f){filter=t.f;render()}
 if(t.td)tdLookup(t.td);
 if(t.sh){const[i,ty]=t.sh.split(':');$('sh-d').value=i;$('sh-t').value=ty;tab('sheet');renderSheet()}
 if(t.eqs)saveEq(t.eqs);
 if(t.eqc)resetEq(t.eqc);
 if(t.eqe)editEq(t.eqk,t.eqe);
 if(t.eqd&&confirm('Delete this entry?')){S[t.eqk]=S[t.eqk].filter(x=>x.id!=t.eqd);commit()}
 if(t.adv){const d=S.deliveries.find(x=>x.id==t.adv);if(d&&d.status<4){d.status++;commit()}}
 if(t.rm&&confirm('Delete this delivery?')){S.deliveries=S.deliveries.filter(x=>x.id!=t.rm);commit()}
 if(t.rc&&confirm('Remove this customer record? (Their deliveries stay.)')){S.customers=S.customers.filter(c=>c.name!=t.rc);commit()}
 if(t.ed){const d=S.deliveries.find(x=>x.id==t.ed);editId=d.id;$('f-date').value=d.date;$('f-cust').value=d.customer;$('f-from').value=d.from;$('f-to').value=d.to;$('f-load').value=d.load;$('f-mi').value=d.miles||'';$('f-rate').value=d.rate||'';$('f-st').value=d.status;$('f-unit').value=d.unit;$('f-notes').value=d.notes;$('f-truck').value=d.truck||'';$('f-trailer').value=d.trailer||'';$('f-lm').value=d.lm||'';$('f-lw').value=d.lw||'';$('f-ld').value=d.ld||'';updatePlan();$('ft').textContent='Edit Delivery';$('f-cancel').style.display='';$('f-date').scrollIntoView({behavior:'smooth',block:'center'})}});
$('q').oninput=render;
$('f-lm').addEventListener('input',autofillLoad);
['f-truck','f-trailer','f-lw'].forEach(i=>['input','change'].forEach(ev=>$(i).addEventListener(ev,updatePlan)));

/* ===== DATA ===== */
function dl(name,mime,text){const a=document.createElement('a');a.href='data:'+mime+';charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click()}
$('x-json').onclick=()=>dl('deliveries-backup.json','application/json',JSON.stringify(S,null,1));

const hs=(id,l,o)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option value="${x[0]}"${x[2]?' selected':''}>${x[1]}</option>`).join('')}</select></div>`;
const HST=[
 {k:'FL',n:'Florida (FDOT)',max:'199,000 lb',legal:`8'6"W | 13'6"H | 80k lb`,pole:`> 15'0" high`,esc:`1 escort > 12'W · 2 escorts > 14'6"W`,x:['Police escort',`> 15'0" to 16'0" wide`],r:['Ag stations: ALL commercial vehicles (even empty flatbeds/lowboys) must pull in.','Sunday travel permitted for loads under 14\' wide in daylight.','Urban peak-hour curfews (7-9 AM, 4-6:30 PM) around Miami, Orlando, Tampa.']},
 {k:'AL',n:'Alabama (ALDOT)',max:'150,000 lb',legal:`8'6"W | 13'6"H | 80k lb`,pole:`> 15'6" high`,esc:`1 escort > 12'W · 2 escorts > 14'W`,x:['Sunday movement','Prohibited'],r:['Monday–Saturday, sunrise to sunset only.','Rear escort if rear overhang > 5 ft or length > 90 ft.','Over 150,000 lb GVW needs formal ALDOT bridge review.']},
 {k:'MS',n:'Mississippi (MDOT)',max:'150,000 lb',legal:`8'6"W | 13'6"H | 80k lb`,pole:`> 15'6" high`,esc:`1 escort > 12'W · 2 escorts > 13'W (2-lane)`,x:['Overweight 24/7','Allowed if legal dimensions'],r:['Inner-bridge: about 28-30 ft gap between drives and trailer axles for max trailer weight.','Overweight-only loads within legal dimensions may run 24/7.','Non-interstate exemptions apply for harvest commodities.']},
 {k:'GA',n:'Georgia (GDOT)',max:'150,000 lb',legal:`8'6"W | 13'6"H | 80k lb`,pole:`> 15'6" high`,esc:`1 rear escort > 12'W · 2 escorts > 14'8"W`,x:['Atlanta bypass','I-285 mandatory'],r:['Through OS/OW loads must use the I-285 bypass, not downtown I-75/85.','Commercial trucks banned from far-left lanes on 3+ lane highways.','No OS/OW movement 6-9 AM and 4-7 PM in metro Atlanta counties.']}];
const CHAIN=[[6600,'Grade 70 · 3/8" (WLL 6,600 lb)'],[11300,'Grade 70 · 1/2" (WLL 11,300 lb)',1],[18100,'Grade 70 · 5/8" (WLL 18,100 lb)'],[12000,'Grade 80 · 1/2" (WLL 12,000 lb)'],[15000,'Grade 100 · 1/2" (WLL 15,000 lb)']];
const hhSub=['Axle & Bridge','Permit Fees','State Rules','Securement'];
$('p-hh').innerHTML=`<div class="chips" id="hh-nav">${hhSub.map((t,i)=>`<button class="chip" onclick="hhTab(${i})">${t}</button>`).join('')}</div>
<p class="warn" style="margin:0 0 12px">Limits, fee schedules and state rules here came from a tool you pasted and are not verified. Confirm every figure with the state permit offices (FDOT, ALDOT, MDOT, GDOT), 49 CFR 393 and your chain tags before you move a load.</p>
<div id="hh-0"><div class="panel"><div class="ph"><div class="pt">Rig &amp; Weights</div><button class="g" onclick="hhPull()">Pull from my truck, trailer &amp; load</button></div>
 <div class="fg">${hs('hh-dr','Tractor drive axles',[['tandem','Tandem (2)',1],['tridem','Tridem (3)']])}${hs('hh-tr','Trailer axles',[['tandem','Tandem (2)'],['tridem','Tridem (3)',1],['quad','Quad (4)']])}
 <div><label>Flip axle / booster</label><select id="hh-flip"><option value="">No</option><option value="1">Yes (+1 trailer axle)</option></select></div>
 ${hi('hh-tare','Total tare (lb)',36000)}${hi('hh-pay','Payload (lb)',44000)}${hi('hh-bias','Payload bias % to trailer',50,'min="30" max="70"')}
 ${hi('hh-sd','Steer to drive 1 (ft)',18)}${hi('hh-ds','Drive spread (ft/axle)',4.3,'step="0.1"')}${hi('hh-ib','Inner bridge gap (ft)',28)}${hi('hh-ts','Trailer spread (ft/axle)',4.3,'step="0.1"')}</div></div>
 <div class="panel"><div class="ph"><div class="pt">Result</div><span id="hh-super" class="badge" style="color:var(--red);display:none">SUPERLOAD</span></div><div id="hh-svg" style="overflow-x:auto"></div><div class="stats" id="hh-stats"></div><div id="hh-fbf"></div><div id="hh-states"></div></div></div>
<div id="hh-1" style="display:none"><div class="panel"><div class="ph"><div class="pt">Single-Trip Permit Fee Estimate</div><button class="g" onclick="hhPull()">Pull from my truck, trailer &amp; load</button></div>
 <div class="fg">${hi('pf-gvw','GVW (lb)',115000)}${hi('pf-w','Width (ft)',11.5,'step="0.1"')}${hi('pf-h','Height (ft)',13.5,'step="0.1"')}${hi('pf-l','Length (ft)',75,'step="0.1"')}
 ${hs('pf-rt','Route',[['all','4-state corridor',1],['FL','Florida only'],['AL','Alabama only'],['MS','Mississippi only'],['GA','Georgia only']])}</div>
 <div class="pt" style="margin:6px 0">Miles inside each state</div><div class="fg">${hi('pf-FL','Florida',180)}${hi('pf-AL','Alabama',140)}${hi('pf-MS','Mississippi',110)}${hi('pf-GA','Georgia',160)}</div></div>
 <div class="panel"><div class="stat" style="margin-bottom:12px"><b id="pf-tot">$0</b><span id="pf-fac"></span></div><div class="stats" id="pf-cards"></div><p class="warn">Does not include routing service or escort fees.</p></div></div>
<div id="hh-2" style="display:none"><div class="panel"><div class="fg"><div><label>State</label><select id="st-f"><option value="">All states</option>${HST.map(x=>`<option value="${x.k}">${x.n}</option>`).join('')}</select></div></div></div><div id="st-cards"></div></div>
<div id="hh-3" style="display:none"><div class="panel"><div class="ph"><div class="pt">Cargo Securement (49 CFR 393)</div></div>
 <div class="fg">${hi('sc-w','Cargo weight (lb)',45000)}${hi('sc-l','Cargo length (ft)',18)}${hs('sc-t','Cargo type',[['eq','Heavy machinery / equipment',1],['gen','General / other']])}
 ${hs('sc-m','Tie-down method',[['d','Direct (attached to anchor points)',1],['i','Indirect (over the top, counts 50%)']])}${hs('sc-c','Chain',CHAIN.map(c=>[c[0],c[1],c[2]]))}</div></div>
 <div class="panel"><div id="sc-out"></div></div></div>`;
let hhI=0;
function hhTab(i){hhI=i;[0,1,2,3].forEach(j=>$('hh-'+j).style.display=j==i?'':'none');document.querySelectorAll('#hh-nav .chip').forEach((c,j)=>c.classList.toggle('on',j==i))}
const hn=id=>Number($(id).value)||0,fm=n=>'$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),k=n=>Math.round(n).toLocaleString();
function hhPull(){const tr=S.trucks.find(x=>x.id==$('c-truck').value),tl=S.trailers.find(x=>x.id==$('c-trailer').value),q=Math.max(1,hn('c-qty')),arr=$('c-arr').value;
 const w=hn('c-wt')*q,L=hn('c-len')*(arr=='len'?q:1),W=hn('c-wid')*(arr=='wid'?q:1),tare=(tr?Number(tr.empty)||0:0)+(tl?Number(tl.empty)||0:0);
 if(tare)$('hh-tare').value=tare;if(w)$('hh-pay').value=w;
 const dkW=tl&&tl.width?tl.width*12:0,dkL=tl&&tl.len?tl.len*12:0,tg=tare+w;
 $('pf-gvw').value=tg||$('pf-gvw').value;if(W||dkW)$('pf-w').value=(Math.max(W,dkW)/12).toFixed(1);if(hn('c-hgt'))$('pf-h').value=((hn('c-deck')+hn('c-hgt'))/12).toFixed(1);if(L||dkL)$('pf-l').value=(Math.max(L,dkL)/12).toFixed(1);
 $('sc-w').value=w||$('sc-w').value;if(L)$('sc-l').value=(L/12).toFixed(0);hhAll()}
function hhAxle(){
 const nD=$('hh-dr').value=='tandem'?2:3;let nT={tandem:2,tridem:3,quad:4}[$('hh-tr').value];if($('hh-flip').value)nT++;const N=1+nD+nT;
 const sd=hn('hh-sd')||18,ds=hn('hh-ds')||4.3,ib=hn('hh-ib')||28,ts=hn('hh-ts')||4.3,L=sd+(nD-1)*ds+ib+(nT-1)*ts,tare=hn('hh-tare'),pay=hn('hh-pay'),gvw=tare+pay,bias=(hn('hh-bias')||50)/100;
 const part=(tare-12000)/2,steer=Math.round(12000+pay*.05),drv=Math.round(part+pay*.95*(1-bias)),trl=Math.round(part+pay*.95*bias),fbf=Math.round(500*(L*N/(N-1)+12*N+36));
 $('hh-stats').innerHTML=[['Steer',k(steer)+' lb'],['Drives',k(drv)+' lb'],['Trailer',k(trl)+' lb'],['GVW',k(gvw)+' lb'],['Outer bridge',L.toFixed(1)+' ft'],['Axles',N]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 const ok=gvw<=fbf;$('hh-fbf').innerHTML=`<div class="d"><div><div class="t">Federal Bridge Formula B</div><div class="s">W = 500 × [ LN/(N−1) + 12N + 36 ]</div></div><div class="r"><div class="t mono" style="color:var(--${ok?'green-bright':'amber'})">${k(fbf)} lb</div><span class="badge" style="color:var(--${ok?'green-bright':'amber'})">${ok?'PASS':'OVER — PERMIT'}</span></div></div>`;
 const R={FL:[nD==2?44000:60000,nT==2?44000:nT==3?66000:74000,199000],AL:[nD==2?44000:60000,nT==2?44000:nT==3?66000:88000,150000],MS:[nD==2?44000:54000,nT==2?44000:nT==3?60000:80000,150000],GA:[nD==2?45000:60000,nT==2?45000:nT==3?60000:70000,150000]};
 let sup=false;$('hh-states').innerHTML=HST.map(st=>{const c=R[st.k],a=drv<=c[0],b=trl<=c[1],g=gvw<=c[2];if(gvw>c[2])sup=true;const col=!(a&&b&&g)?'red':gvw>120000?'amber':'green-bright';
  const f=(v,m,o)=>`<span style="color:var(--${o?'text':'red'})">${k(v)} / ${k(m)}</span>`;
  return `<div class="d"><div><div class="t">${st.n}</div><div class="s">Drives ${f(drv,c[0],a)} · Trailer ${f(trl,c[1],b)} · GVW ${f(gvw,c[2],g)}</div></div><div class="r"><span class="badge" style="color:var(--${col})">${col=='red'?'OVER SINGLE-TRIP LIMIT':col=='amber'?'HEAVY PERMIT':'ROUTINE'}</span></div></div>`}).join('');
 $('hh-super').style.display=sup?'':'none';
 const sc=800/L,x=i=>20+i*sc;let sv=`<svg viewBox="0 0 860 120" style="min-width:600px;width:100%"><line x1="0" y1="80" x2="860" y2="80" stroke="var(--line)" stroke-width="3"/>`,pos=[[0,'S']];
 for(let i=0;i<nD;i++)pos.push([sd+i*ds,'D']);for(let i=0;i<nT;i++)pos.push([sd+(nD-1)*ds+ib+i*ts,'T']);
 pos.forEach(([ft,t])=>sv+=`<circle cx="${x(ft)}" cy="66" r="10" fill="var(--panel-2)" stroke="var(--${t=='S'?'amber':t=='D'?'green-bright':'blue'})" stroke-width="3"/>`);
 sv+=`<text x="${x(0)}" y="108" fill="var(--dim)" font-size="11">steer</text><text x="${x(sd)}" y="108" fill="var(--dim)" font-size="11">drives ${sd} ft</text><text x="${x(sd+(nD-1)*ds+ib)}" y="108" fill="var(--amber)" font-size="11">inner bridge ${ib} ft → trailer</text></svg>`;$('hh-svg').innerHTML=sv}
function hhPermit(){
 const gvw=hn('pf-gvw'),w=hn('pf-w'),h=hn('pf-h'),l=hn('pf-l'),rt=$('pf-rt').value,os=w>8.5||h>13.5||l>65,ow=gvw>80000,go=ow||os,mi={};
 HST.forEach(x=>mi[x.k]=rt=='all'||rt==x.k?hn('pf-'+x.k):0);
 const F={};
 let o=[],a=0;if(go&&mi.FL>0){a=5;if(w>14)o.push(['Oversize',25]);else if(w>12)o.push(['Oversize',15]);else if(w>8.5)o.push(['Oversize',5]);if(h>14.5)o.push(['Height',10]);if(l>85)o.push(['Length',10]);
  if(ow){const r=gvw<=100000?.27:gvw<=120000?.32:gvw<=140000?.37:gvw<=160000?.42:.5;o.push(['Overweight',Math.max(10,mi.FL*r)])}}F.FL=a?[['Admin',a],...o]:[];
 o=[];if(go&&mi.AL>0){if(os)o.push(['Oversize',10]);if(gvw>150000)o.push(['Overweight',100],['Engineering review',150]);else if(gvw>120000)o.push(['Overweight',30]);else if(gvw>100000)o.push(['Overweight',20]);else if(gvw>80000)o.push(['Overweight',10])}F.AL=o;
 o=[];if(go&&mi.MS>0){o.push(['Base permit',10]);if(ow)o.push(['Overweight ('+Math.ceil((gvw-80000)/1000)+'k lb over)',Math.ceil((gvw-80000)/1000)*.05*mi.MS])}F.MS=o;
 o=[];if(go&&mi.GA>0){o.push(['Single-trip base',30]);if(gvw>150000)o.push(['Superload',500]);else if(gvw>125000)o.push(['Overweight',125]);else if(gvw>80000)o.push(['Overweight',30])}F.GA=o;
 let tot=0;$('pf-cards').innerHTML=HST.map(x=>{const t=F[x.k].reduce((s,r)=>s+r[1],0);tot+=t;return `<div class="stat"><span>${x.n} · ${mi[x.k]} mi</span>${F[x.k].map(r=>`<div class="s" style="display:flex;justify-content:space-between"><span>${r[0]}</span><span class="mono">${fm(r[1])}</span></div>`).join('')||'<div class="s">No permit needed</div>'}<b style="margin-top:6px">${fm(t)}</b></div>`}).join('');
 $('pf-tot').textContent=fm(tot);$('pf-fac').textContent='Estimated total · '+([os&&'Oversize',ow&&'Overweight'].filter(Boolean).join(' & ')||'Legal size and weight')}
function hhRules(){const f=$('st-f').value;$('st-cards').innerHTML=HST.filter(x=>!f||x.k==f).map(x=>`<div class="panel"><div class="ph"><div class="pt">${x.n}</div><div class="pill">Routine max ${x.max}</div></div>
 <div class="stats"><div class="stat"><span>Legal limits (no permit)</span><div class="s">${x.legal}</div></div><div class="stat"><span>Height pole</span><div class="s">${x.pole}</div></div><div class="stat"><span>Escorts</span><div class="s">${x.esc}</div></div><div class="stat"><span>${x.x[0]}</span><div class="s">${x.x[1]}</div></div></div>
 <ul style="margin:0;padding-left:18px;color:var(--dim);font-size:13px">${x.r.map(r=>`<li>${r}</li>`).join('')}</ul></div>`).join('')}
function hhSec(){const w=hn('sc-w'),l=hn('sc-l'),eq=$('sc-t').value=='eq',dir=$('sc-m').value=='d',wll=hn('sc-c'),req=Math.round(w*.5);
 let byLen=l>10?2+Math.ceil((l-10)/10):l>5?2:1;if(eq&&w>=10000)byLen=Math.max(byLen,4);
 const per=dir?wll:wll*.5,byW=per?Math.ceil(req/per):0,n=Math.max(byLen,byW);
 $('sc-out').innerHTML=`<div class="stats"><div class="stat"><b>${k(req)} lb</b><span>Required aggregate WLL (50% of cargo)</span></div><div class="stat"><b>${n}</b><span>Minimum chains / tie-downs</span></div><div class="stat"><b>${k(n*per)} lb</b><span>WLL provided</span></div></div>
 <div class="s" style="color:var(--dim)">Count set by ${byW>byLen?'working load needed':eq&&w>=10000?'the 4-tie-down rule for equipment over 10,000 lb':'cargo length'} (${byLen} by length, ${byW} by WLL). ${dir?'Direct tie-downs count 100%.':'Indirect tie-downs counted at 50%.'} Secure booms, buckets and attachments separately. The WLL marked on your chain tag governs.</div>`}
function hhAll(){hhAxle();hhPermit();hhRules();hhSec()}
$('p-hh').addEventListener('input',hhAll);$('p-hh').addEventListener('change',hhAll);hhTab(0);hhAll();

resetForm();tab('over');render();
</script></body></html>
